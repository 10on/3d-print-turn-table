[platformio]
default_envs = usb

[common]
platform      = espressif32
board         = esp32-c3-devkitm-1  ; ESP32-C3 SuperMini
framework     = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    gin66/FastAccelStepper@^0.31
    teemuatlut/TMCStepper@^0.7.3
    h2zero/NimBLE-Arduino@^2.1

[env:usb]
extends = common
build_src_filter = +<*> -<test_*.cpp>

[env:ota]
extends = common
build_src_filter = +<*> -<test_*.cpp>
; HTTP upload (src/ota.cpp), table must be in OTA mode: "w" command / remote's Service menu
upload_protocol = custom
upload_command  = curl --fail -sS -F firmware=@$SOURCE http://${sysenv.OTA_HOST}/update

; Bring-up: swings the motor +-90 deg, no WiFi/BLE
[env:motor_test]
extends = common
build_src_filter = -<*> +<test_motor.cpp> +<motor.cpp> +<battery.cpp>

; Bring-up: raw UART link check with the TMC2208
[env:uart_test]
extends = common
build_src_filter = -<*> +<test_uart.cpp>
